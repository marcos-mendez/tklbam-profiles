# Coverage gate for tklbam-profiles. Threshold 0: nothing is measured on
# master (COVERAGE.md). tests/coverage.sh and the profile lint arrive with
# fix/moodle-dataroot; raise the threshold when it merges.
name: tests
on:
  pull_request:
  push:
    branches: [master]
jobs:
  tests:
    uses: keel-linux/.github/.github/workflows/test-shell.yml@main
    with:
      threshold: 0
